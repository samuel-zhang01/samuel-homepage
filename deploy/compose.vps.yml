services:
  app:
    image: "${PORTFOLIO_IMAGE:?An immutable portfolio image is required}"
    container_name: samuel-homepage
    user: "1001:1001"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0700,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    cpus: "0.5"
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      edge:
        aliases:
          - samuel-homepage

networks:
  edge:
    name: portfolio_edge
    external: true
