services:
  samuel-homepage:
    build:
      context: .
      dockerfile: Dockerfile
    image: samuel-homepage:production
    container_name: samuel-homepage
    ports:
      # Bind to the LAN interface on the deployment host so the HTTPS reverse
      # proxy can reach the app. Set HOMEPAGE_BIND_ADDRESS=127.0.0.1 when the
      # proxy runs on the same host and direct LAN access is not required.
      - "${HOMEPAGE_BIND_ADDRESS:-0.0.0.0}:${HOMEPAGE_PORT:-5174}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    cpus: "${HOMEPAGE_CPU_LIMIT:-1.0}"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homepage-network

networks:
  homepage-network:
    driver: bridge
