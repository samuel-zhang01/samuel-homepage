services:
  samuel-homepage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samuel-homepage
    ports:
      - "0.0.0.0:${HOMEPAGE_PORT:-5174}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homepage-network

networks:
  homepage-network:
    driver: bridge
